[pytest]
testpaths = tests
# Por defecto no se corren los tests que necesitan base de datos o API (Art. 6):
# `pytest` debe pasar en una máquina limpia. Para correrlos: `pytest -m integration`.
addopts = -m "not integration and not llm"
markers =
    integration: requiere base de datos en marcha (docker compose up -d)
    llm: requiere GEMINI_API_KEY y llamadas reales al modelo
