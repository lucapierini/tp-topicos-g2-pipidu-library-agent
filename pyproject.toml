# Solo configuración de herramientas: el proyecto no se publica como paquete.

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "openspec", "TP"]

[tool.ruff.lint]
# E/F: pycodestyle y pyflakes. I: imports ordenados. B: bugbear. UP: sintaxis moderna.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # los docstrings en español y las trazas a R-x.y exceden a veces el ancho
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
