server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API del agente. La respuesta de POST /ask es SSE: sin buffering, para que el progreso llegue en vivo,
    # y con un timeout de lectura largo (una consulta puede tardar minutos; la API envía un latido cada 5 s).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
